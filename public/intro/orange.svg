<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="orangeBody" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="40%" stop-color="#ff9a2e"/>
      <stop offset="85%" stop-color="#e85a0c"/>
      <stop offset="100%" stop-color="#a83a00"/>
    </radialGradient>
    <radialGradient id="orangePeel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0"/>
      <stop offset="80%" stop-color="#ff8c1a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7a2a00" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="orangeHi" cx="35%" cy="28%" r="30%">
      <stop offset="0%" stop-color="#fff3c4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Body -->
  <circle cx="150" cy="155" r="120" fill="url(#orangeBody)"/>
  <circle cx="150" cy="155" r="120" fill="url(#orangePeel)"/>
  <!-- Texture dots (peel pores) -->
  <g fill="#a83a00" opacity="0.25">
    <circle cx="90" cy="110" r="2"/>
    <circle cx="120" cy="90" r="1.6"/>
    <circle cx="160" cy="85" r="2.2"/>
    <circle cx="200" cy="100" r="1.8"/>
    <circle cx="230" cy="135" r="2"/>
    <circle cx="80" cy="160" r="2"/>
    <circle cx="110" cy="180" r="1.6"/>
    <circle cx="150" cy="200" r="2.2"/>
    <circle cx="200" cy="195" r="1.8"/>
    <circle cx="240" cy="180" r="2"/>
    <circle cx="100" cy="220" r="1.8"/>
    <circle cx="160" cy="240" r="2.2"/>
    <circle cx="210" cy="230" r="1.8"/>
    <circle cx="135" cy="135" r="1.6"/>
    <circle cx="180" cy="155" r="1.8"/>
    <circle cx="220" cy="170" r="2"/>
    <circle cx="95" cy="195" r="1.8"/>
    <circle cx="170" cy="115" r="1.6"/>
  </g>
  <!-- Highlight -->
  <ellipse cx="115" cy="110" rx="40" ry="28" fill="url(#orangeHi)"/>
  <!-- Stem leaf -->
  <g transform="translate(150 35) rotate(-15)">
    <path d="M0 0 Q -8 -22 -28 -28 Q -22 -8 -2 0 Z" fill="#3d8b3d"/>
    <path d="M-2 -2 Q -12 -14 -22 -18" stroke="#1f5f1f" stroke-width="1.4" fill="none"/>
    <circle cx="0" cy="2" r="3" fill="#5b3a1a"/>
  </g>
