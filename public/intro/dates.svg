<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="dateBody1" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a35a2a"/>
      <stop offset="50%" stop-color="#5a2a10"/>
      <stop offset="100%" stop-color="#1a0a04"/>
    </radialGradient>
    <radialGradient id="dateBody2" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#8b4a22"/>
      <stop offset="50%" stop-color="#3f1f0c"/>
      <stop offset="100%" stop-color="#150802"/>
    </radialGradient>
    <radialGradient id="dateHi" cx="40%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#d68a4a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d68a4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dateHi2" cx="40%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#b06a32" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#b06a32" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Back date -->
  <g transform="translate(170 90) rotate(18)">
    <ellipse cx="0" cy="0" rx="55" ry="85" fill="url(#dateBody2)"/>
    <ellipse cx="-12" cy="-25" rx="22" ry="32" fill="url(#dateHi2)"/>
    <!-- Wrinkle lines -->
    <g stroke="#150802" stroke-width="1.2" fill="none" opacity="0.55">
      <path d="M-30 -50 Q 0 -40 30 -55"/>
      <path d="M-35 -20 Q 0 -10 35 -25"/>
      <path d="M-38 10 Q 0 20 38 5"/>
      <path d="M-35 40 Q 0 50 35 35"/>
      <path d="M-30 65 Q 0 72 30 60"/>
    </g>
    <!-- Stem -->
    <circle cx="0" cy="-83" r="4" fill="#6b4423"/>
    <line x1="0" y1="-85" x2="0" y2="-95" stroke="#3d2410" stroke-width="2.5"/>
  </g>

  <!-- Front date (larger, foreground) -->
  <g transform="translate(120 165) rotate(-12)">
    <ellipse cx="0" cy="0" rx="62" ry="95" fill="url(#dateBody1)"/>
    <ellipse cx="-15" cy="-30" rx="26" ry="38" fill="url(#dateHi)"/>
    <!-- Wrinkle lines -->
    <g stroke="#1a0a04" stroke-width="1.4" fill="none" opacity="0.6">
      <path d="M-35 -55 Q 0 -45 35 -60"/>
      <path d="M-42 -25 Q 0 -15 42 -30"/>
      <path d="M-45 5 Q 0 15 45 0"/>
      <path d="M-42 35 Q 0 45 42 30"/>
      <path d="M-35 65 Q 0 75 35 60"/>
      <path d="M-25 85 Q 0 92 25 80"/>
    </g>
    <!-- Stem -->
    <circle cx="0" cy="-93" r="5" fill="#6b4423"/>
    <line x1="0" y1="-95" x2="0" y2="-108" stroke="#3d2410" stroke-width="3"/>
  </g>
</svg>
